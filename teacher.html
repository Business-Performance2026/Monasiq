<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>جدولي | {app}</title>
  <script>try{if(localStorage.getItem("lang")==="en"){var h=document.documentElement;h.className+=" i18n-pending";h.dir="ltr";h.lang="en";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script>
  <link rel="stylesheet" href="assets/style.css?v=202611142225">
  <link rel="manifest" href="manifest.webmanifest?v=202611142225">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png?v=202611142225">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png?v=202611142225">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png?v=202611142225">
  <meta name="theme-color" content="#012950">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مُنسِّق">
</head>
<body class="teacher-page">
<div id="loading" class="loading"><div><div class="spinner"></div>جارٍ التحميل...</div></div>

<div class="hidden" id="appRoot">
  <header class="tp-top">
    <div class="tb-title">
      <img class="logo-mark sm" src="assets/img/icon-64.png?v=202611142225" alt="">
      <div><b data-app-name></b><small id="schoolName" data-no-i18n></small></div>
    </div>
    <div class="tb-actions">
      <button class="bell" id="bellBtn" title="الإشعارات" aria-label="الإشعارات"><span data-ic="bell" data-size="20"></span><i class="nbadge hidden" id="bellN"></i></button>
      <button class="lang-btn" data-lang-toggle></button>
      <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج"><span data-ic="logout"></span></button>
    </div>
  </header>
  <main class="tp-main" id="view"></main>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script type="module" src="assets/teacher.js?v=202611142225"></script>
</body>
</html>
