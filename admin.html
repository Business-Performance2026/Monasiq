<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة المنصة | {app}</title>
  <script>try{if(localStorage.getItem("lang")==="en"){var h=document.documentElement;h.className+=" i18n-pending";h.dir="ltr";h.lang="en";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script>
  <link rel="stylesheet" href="assets/style.css?v=202611151929">
  <link rel="manifest" href="manifest.webmanifest?v=202611151929">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png?v=202611151929">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png?v=202611151929">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png?v=202611151929">
  <meta name="theme-color" content="#012950">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مُنسِّق">
</head>
<body>
<div id="loading" class="loading"><div><div class="spinner"></div>جارٍ التحميل...</div></div>

<div class="app hidden" id="appRoot">
  <aside class="side" id="side">
    <div class="side-top"><div class="logo"><img class="logo-mark" src="assets/img/icon-96.png?v=202611151929" alt=""><span data-app-name></span></div>
      <button class="bell" data-bell title="طلبات الاشتراك" aria-label="طلبات الاشتراك"><span data-ic="bell" data-size="20"></span><i class="nbadge hidden" data-bell-n></i></button></div>
    <div class="school-name">لوحة إدارة المنصة</div>
    <nav>
      <a href="#stats" data-view="stats"><span data-ic="chart"></span>الإحصائيات</a>
      <a href="#schools" data-view="schools"><span data-ic="schools"></span>المدارس</a>
      <a href="#payments" data-view="payments"><span data-ic="card"></span>طلبات الاشتراك <span class="nbadge hidden" data-pay-n></span></a>
      <a href="#billing" data-view="billing"><span data-ic="settings"></span>إعدادات الاشتراك</a>
      <a href="index.html" target="_blank"><span data-ic="web"></span>الصفحة الرئيسية</a>
    </nav>
    <button class="lang-btn" data-lang-toggle></button>
    <button class="btn logout" data-logout><span data-ic="logout" data-size="18"></span>تسجيل الخروج</button>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="tb-title">
        <img class="logo-mark sm" src="assets/img/icon-64.png?v=202611151929" alt="">
        <div><b data-app-name></b><small>لوحة إدارة المنصة</small></div>
      </div>
      <div class="tb-actions"><button class="bell" data-bell title="طلبات الاشتراك"><span data-ic="bell" data-size="20"></span><i class="nbadge hidden" data-bell-n></i></button><button class="lang-btn" data-lang-toggle></button><button class="icon-btn" data-logout title="تسجيل الخروج"><span data-ic="logout"></span></button></div>
    </header>
    <div class="adm-mtabs tabs">
      <a href="#stats" data-view="stats">الإحصائيات</a>
      <a href="#schools" data-view="schools">المدارس</a>
      <a href="#payments" data-view="payments">الطلبات <span class="nbadge hidden" data-pay-n></span></a>
      <a href="#billing" data-view="billing">الإعدادات</a>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script type="module" src="assets/admin.js?v=202611151929"></script>
</body>
</html>
