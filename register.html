<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>التسجيل | {app}</title>
  <script>try{if(localStorage.getItem("lang")==="en"){var h=document.documentElement;h.className+=" i18n-pending";h.dir="ltr";h.lang="en";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script>
  <link rel="stylesheet" href="assets/style.css?v=202611150651">
  <link rel="manifest" href="manifest.webmanifest?v=202611150651">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png?v=202611150651">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icon-16.png?v=202611150651">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png?v=202611150651">
  <meta name="theme-color" content="#012950">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مُنسِّق">
</head>
<body>
<button class="lang-btn auth-lang" data-lang-toggle></button>
<div class="auth-page">
  <div class="auth-box">
    <a href="index.html" class="auth-brand"><img class="auth-logo" src="assets/img/logo.png?v=202611150651" alt="مُنسِّق"></a>

    <div class="card" id="formCard">
      <div class="seg wide" id="typeSeg">
        <button type="button" data-type="school" class="active">تسجيل مدرسة</button>
        <button type="button" data-type="teacher">تسجيل معلم</button>
      </div>

      <!-- تسجيل مدرسة -->
      <div id="schoolPane">
        <h1>تسجيل مدرسة جديدة</h1>
        <p class="sub">بعد إرسال الطلب ستراجعه إدارة المنصة وتفعّل حسابك.</p>
        <form id="regForm" novalidate>
          <div class="grid-2">
            <div class="field"><label>المحافظة *</label><select name="region" id="regGov" required></select></div>
            <div class="field"><label>الولاية *</label><select name="wilayah" id="regWil" required></select></div>
          </div>
          <div class="field sugg-wrap"><label>اسم المدرسة *</label><input name="name" id="regName" required autocomplete="off" placeholder="مثال: مدرسة أبو عبيدة (10-12)">
            <div class="sugg hidden" id="regSugg"></div>
            <div class="notice warn hidden" id="regDup"></div>
          </div>
          <div class="field"><label>المراحل الدراسية</label><input name="stages" placeholder="مثال: من العاشر إلى الثاني عشر"></div>
          <div class="grid-2">
            <div class="field"><label>اسم المسؤول *</label><input name="principal" required placeholder="مدير المدرسة أو مسؤول الجدول"></div>
            <div class="field"><label>رقم الهاتف *</label><input name="phone" required inputmode="tel" dir="ltr" placeholder="9xxxxxxx"></div>
          </div>
          <div class="field"><label>البريد الإلكتروني *</label><input name="email" type="email" required dir="ltr" autocomplete="email"></div>
          <div class="grid-2">
            <div class="field"><label>كلمة المرور *</label><input name="password" type="password" required minlength="6" dir="ltr" autocomplete="new-password"></div>
            <div class="field"><label>تأكيد كلمة المرور *</label><input name="password2" type="password" required dir="ltr" autocomplete="new-password"></div>
          </div>
          <p class="error-text" id="err"></p>
          <button class="btn primary block lg" id="submitBtn">إرسال طلب التسجيل</button>
        </form>
      </div>

      <!-- تسجيل معلم -->
      <div id="teacherPane" class="hidden">
        <h1>تسجيل معلم</h1>
        <p class="sub">اختر مدرستك، وبعد موافقة إدارة المدرسة تستطيع الدخول ومشاهدة جدولك.</p>
        <form id="tForm" novalidate>
          <div class="field"><label>المدرسة *</label>
            <div class="grid-2 pick-filters">
              <select id="tGov"></select>
              <select id="tWil"></select>
            </div>
            <div class="sugg-wrap">
              <input type="search" id="tSchoolQ" autocomplete="off" placeholder="ابحث باسم المدرسة">
              <div class="sugg" id="tSugg"></div>
            </div>
            <div class="picked hidden" id="tPicked"></div>
            <select name="schoolId" id="schoolSel" required class="hidden"><option value="">جارٍ تحميل المدارس...</option></select>
          </div>
          <div class="grid-2">
            <div class="field"><label>الاسم الكامل *</label><input name="name" required placeholder="كما هو في جدول المدرسة"></div>
            <div class="field"><label>رقم الهاتف</label><input name="phone" inputmode="tel" dir="ltr" placeholder="9xxxxxxx"></div>
          </div>
          <div id="credFields">
            <div class="field"><label>البريد الإلكتروني *</label><input name="email" type="email" dir="ltr" autocomplete="email"></div>
            <div class="grid-2">
              <div class="field"><label>كلمة المرور *</label><input name="password" type="password" minlength="6" dir="ltr" autocomplete="new-password"></div>
              <div class="field"><label>تأكيد كلمة المرور *</label><input name="password2" type="password" dir="ltr" autocomplete="new-password"></div>
            </div>
          </div>
          <div class="notice warn hidden" id="joinNote"></div>
          <p class="error-text" id="tErr"></p>
          <button class="btn primary block lg" id="tBtn">إرسال طلب الانضمام</button>
        </form>
      </div>

      <p class="auth-foot">لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>

    <div class="card hidden" id="doneCard" style="text-align:center">
      <div class="success-ic">✅</div>
      <h1>تم استلام طلبك</h1>
      <p class="muted" id="doneMsg"></p>
      <a href="index.html" class="btn primary">العودة للصفحة الرئيسية</a>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db, applyBranding, errMsg, configured, defaultPeriods, t, waitUser, norm } from "./assets/app.js?v=202611150651";
  import { govOptions, wilOptions, linkGovWil } from "./assets/oman.js?v=202611150651";
  import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, setDoc, getDocs, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  applyBranding();

  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  let type = qs.get("type") === "teacher" ? "teacher" : "school";
  const joinMode = qs.get("join") === "1";

  function setType(tp) {
    type = tp;
    document.querySelectorAll("#typeSeg button").forEach(b => b.classList.toggle("active", b.dataset.type === tp));
    $("schoolPane").classList.toggle("hidden", tp !== "school");
    $("teacherPane").classList.toggle("hidden", tp !== "teacher");
    if (tp === "teacher") loadSchools();
  }
  $("typeSeg").onclick = e => { const b = e.target.closest("button"); if (b) setType(b.dataset.type); };

  function done(msg) {
    $("doneMsg").textContent = msg;
    $("formCard").classList.add("hidden");
    $("doneCard").classList.remove("hidden");
  }

  // ---------- المدارس المسجلة (للاقتراحات والبحث) ----------
  let schoolsLoaded = false, schools = [], schoolsP = null;
  function fetchSchools() {
    return schoolsP ||= getDocs(collection(db, "publicSchools")).then(snap => {
      schools = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(b.name, "ar"));
      return schools;
    }).catch(() => { schoolsP = null; throw new Error("load"); });
  }
  const place = s => [s.wilayah, s.region].filter(Boolean).join(" — ");
  // تظليل الكلمات المطابقة للبحث داخل اسم المدرسة
  const hl = (name, q) => {
    const ws = norm(q).split(" ").filter(Boolean);
    return String(name).split(/(\s+)/).map(part => ws.length && /\S/.test(part) && ws.some(w => norm(part).includes(w) || w.includes(norm(part))) ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)).join("");
  };
  const anyWord = (q, s) => { const w = norm(q).split(" ").filter(Boolean); const h = norm(s.name + " " + (s.region || "") + " " + (s.wilayah || "")); return w.every(x => h.includes(x)); };

  // ---------- تسجيل مدرسة ----------
  const f = $("regForm"), err = $("err"), btn = $("submitBtn");
  $("regGov").innerHTML = govOptions("", t("— اختر المحافظة —"));
  $("regWil").innerHTML = wilOptions("", "", t("— اختر الولاية —"));
  linkGovWil($("regGov"), $("regWil"), t("— اختر الولاية —"));
  // اقتراحات بأسماء المدارس المسجلة، وتنبيه إذا كانت المدرسة مسجلة مسبقًا في نفس الولاية
  const regCheck = () => {
    const q = $("regName").value.trim(), box = $("regSugg"), dup = $("regDup");
    const gov = $("regGov").value, wil = $("regWil").value;
    const same = schools.find(s => norm(s.name) === norm(q) && (!wil || !s.wilayah || s.wilayah === wil) && (!gov || !s.region || s.region === gov));
    dup.classList.toggle("hidden", !same || !q);
    if (same) dup.textContent = t("«{0}» مسجلة مسبقًا في المنصة ({1}). إذا كانت مدرستك، تواصل مع مسؤول الجدول فيها أو مع إدارة المنصة بدل التسجيل من جديد.", same.name, place(same));
    const hits = q.length < 2 ? [] : schools.filter(s => anyWord(q, s) && s !== same).slice(0, 6);
    box.innerHTML = hits.length ? `<small class="muted">${t("مدارس مسجلة بأسماء مشابهة — اضغط إذا كانت مدرستك:")}</small>` + hits.map(s => `<button type="button" class="sugg-i hit" data-rid="${s.id}"><b>${hl(s.name, q)}</b><small>${escapeHtml(place(s))}</small></button>`).join("") : "";
    box.classList.toggle("hidden", !hits.length);
  };
  $("regName").addEventListener("focus", () => fetchSchools().then(regCheck).catch(() => {}), { once: true });
  // اختيار مدرسة مسجلة من الاقتراحات: نعبّئ بياناتها ونظهر التنبيه
  $("regSugg").addEventListener("click", e => {
    const b = e.target.closest("[data-rid]"); if (!b) return;
    const s = schools.find(x => x.id === b.dataset.rid); if (!s) return;
    if (s.region) { $("regGov").value = s.region; $("regGov").dispatchEvent(new Event("change")); }
    if (s.wilayah) $("regWil").value = s.wilayah;
    $("regName").value = s.name; regCheck();
    $("regDup").scrollIntoView({ block: "center", behavior: "smooth" });
  });
  $("regName").addEventListener("input", regCheck);
  ["change", "input"].forEach(ev => $("regWil").addEventListener(ev, regCheck));
  f.addEventListener("submit", async e => {
    e.preventDefault();
    err.textContent = "";
    const d = Object.fromEntries(new FormData(f).entries());
    for (const k in d) d[k] = d[k].trim();
    if (!d.name || !d.region || !d.wilayah || !d.principal || !d.phone || !d.email || !d.password) return (err.textContent = t("يرجى تعبئة جميع الحقول المطلوبة (*)"));
    if (d.password.length < 6) return (err.textContent = t("كلمة المرور يجب أن تكون 6 أحرف على الأقل"));
    if (d.password !== d.password2) return (err.textContent = t("كلمتا المرور غير متطابقتين"));
    if (!configured) return (err.textContent = t("المنصة غير مربوطة بـ Firebase بعد"));
    btn.disabled = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, d.email, d.password);
      await setDoc(doc(db, "schools", cred.user.uid), {
        name: d.name, region: d.region, wilayah: d.wilayah, stages: d.stages,
        principal: d.principal, phone: d.phone, email: d.email,
        ownerUid: cred.user.uid, status: "pending",
        settings: { days: ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"], periods: defaultPeriods(8) },
        createdAt: serverTimestamp()
      });
      await signOut(auth);
      done(t("شكرًا لتسجيل {0}. طلبك الآن قيد المراجعة، وبعد تفعيله تستطيع الدخول بالبريد وكلمة المرور التي أدخلتها.", d.name));
    } catch (ex) { err.textContent = errMsg(ex); btn.disabled = false; }
  });

  // ---------- تسجيل معلم: بحث عن المدرسة ----------
  async function loadSchools() {
    if (schoolsLoaded) return;
    const sel = $("schoolSel");
    $("tGov").innerHTML = govOptions("", t("كل المحافظات"));
    $("tWil").innerHTML = wilOptions("", "", t("كل الولايات"));
    linkGovWil($("tGov"), $("tWil"), t("كل الولايات"));
    try {
      await fetchSchools();
      sel.innerHTML = `<option value=""></option>` + schools.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
      schoolsLoaded = true;
      drawPick();
    } catch (ex) { $("tSugg").innerHTML = `<div class="muted sugg-e">${t("تعذّر تحميل المدارس")}</div>`; }
  }
  function drawPick() {
    const q = $("tSchoolQ").value.trim(), gov = $("tGov").value, wil = $("tWil").value, box = $("tSugg");
    if (!schools.length) { box.innerHTML = `<div class="muted sugg-e">${t("لا توجد مدارس مفعّلة بعد")}</div>`; return; }
    const list = schools.filter(s => (!gov || s.region === gov) && (!wil || s.wilayah === wil) && (!q || anyWord(q, s)));
    box.innerHTML = list.length ? list.slice(0, 50).map(s => `<button type="button" class="sugg-i ${q ? "hit" : ""}" data-id="${s.id}"><b>${q ? hl(s.name, q) : escapeHtml(s.name)}</b><small>${escapeHtml(place(s))}</small></button>`).join("")
      + (list.length > 50 ? `<div class="muted sugg-e">${t("اكتب أكثر لتضييق البحث")}</div>` : "")
      : `<div class="muted sugg-e">${t("لا توجد نتائج. تأكد أن مدرستك مشتركة في المنصة.")}</div>`;
  }
  ["input", "search"].forEach(ev => $("tSchoolQ").addEventListener(ev, drawPick));
  ["tGov", "tWil"].forEach(id => $(id).addEventListener("change", drawPick));
  $("tSugg").addEventListener("click", e => {
    const b = e.target.closest("[data-id]"); if (!b) return;
    const s = schools.find(x => x.id === b.dataset.id);
    $("schoolSel").value = s.id;
    $("tPicked").innerHTML = `<div><small class="muted">${t("المدرسة المختارة")}</small><b>${escapeHtml(s.name)}</b><small>${escapeHtml(place(s))}</small></div><button type="button" class="btn sm ghost" id="tChange">${t("تغيير")}</button>`;
    $("tPicked").classList.remove("hidden");
    $("tSchoolQ").closest(".sugg-wrap").classList.add("hidden"); $("tGov").parentElement.classList.add("hidden");
    $("tChange").onclick = () => { $("schoolSel").value = ""; $("tPicked").classList.add("hidden"); $("tSchoolQ").closest(".sugg-wrap").classList.remove("hidden"); $("tGov").parentElement.classList.remove("hidden"); };
  });
  function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // وضع الانضمام: مستخدم مسجّل دخول وليس مرتبطًا بمدرسة
  let joinUser = null;
  if (joinMode) {
    joinUser = await waitUser();
    if (joinUser) {
      $("credFields").classList.add("hidden");
      $("typeSeg").classList.add("hidden");
      $("joinNote").classList.remove("hidden");
      $("joinNote").textContent = t("أنت مسجّل الدخول بالبريد {0}. اختر مدرستك لإرسال طلب انضمام جديد.", joinUser.email);
    }
  }
  setType(joinUser ? "teacher" : type);

  const tf = $("tForm"), tErr = $("tErr"), tBtn = $("tBtn");
  tf.addEventListener("submit", async e => {
    e.preventDefault();
    tErr.textContent = "";
    const d = Object.fromEntries(new FormData(tf).entries());
    for (const k in d) d[k] = String(d[k]).trim();
    if (!d.schoolId || !d.name || (!joinUser && (!d.email || !d.password))) return (tErr.textContent = t("يرجى تعبئة جميع الحقول المطلوبة (*)"));
    if (!joinUser && d.password.length < 6) return (tErr.textContent = t("كلمة المرور يجب أن تكون 6 أحرف على الأقل"));
    if (!joinUser && d.password !== d.password2) return (tErr.textContent = t("كلمتا المرور غير متطابقتين"));
    if (!configured) return (tErr.textContent = t("المنصة غير مربوطة بـ Firebase بعد"));
    const school = schools.find(s => s.id === d.schoolId);
    tBtn.disabled = true;
    try {
      const user = joinUser || (await createUserWithEmailAndPassword(auth, d.email, d.password)).user;
      await setDoc(doc(db, "teacherAccounts", user.uid), {
        name: d.name, phone: d.phone, email: user.email || d.email,
        schoolId: d.schoolId, schoolName: school?.name || "", status: "pending", createdAt: serverTimestamp()
      });
      await signOut(auth);
      done(t("تم إرسال طلب انضمامك إلى {0}. بعد موافقة إدارة المدرسة تستطيع الدخول ومشاهدة جدولك.", school?.name || ""));
    } catch (ex) { tErr.textContent = errMsg(ex); tBtn.disabled = false; }
  });
</script>
</body>
</html>
